# The one line. Change it and run ./demo write again: new data uses the new
# algorithm, and everything already in data/ still reads.
#
#   RSA-OAEP-3072       classical, quantum-vulnerable
#   ML-KEM-768          post-quantum (FIPS 203)
#   X25519+ML-KEM-768   hybrid: both at once
crypto.wrap=RSA-OAEP-3072
