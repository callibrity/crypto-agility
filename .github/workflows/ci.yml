name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'liberica'
          cache: maven
      - name: Check formatting and license headers
        run: ./mvnw -B spotless:check license:check

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25', '27']
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'liberica'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
